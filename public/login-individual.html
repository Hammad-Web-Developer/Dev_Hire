<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Individual Login | Dev Hire</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body class="auth-page">
  <a class="brand auth-brand" href="index.html"><span class="brand-mark">D</span> Dev Hire</a>
  <main class="auth-card">
    <a class="back-link" href="index.html">← Back to home</a>
    <p class="eyebrow">CANDIDATE ACCOUNT</p>
    <h1>Welcome back</h1>
    <p class="form-intro">Log in to continue to your individual dashboard.</p>
    <form action="#" method="post">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required>

      <a href="forgot-password.html">Forgot password?</a>
      <button class="button button-primary button-full" type="submit">Log in</button>
    </form>
    <p class="switch-auth">New to Dev Hire? <a href="signup-individual.html">Create an account</a></p>
    <p class="fine-print"><a href="login-company.html">Log in as a company</a></p>
  </main>
</body>
</html>
