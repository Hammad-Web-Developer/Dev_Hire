<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Login | Dev Hire</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body class="auth-page">
  <a class="brand auth-brand" href="index.html"><span class="brand-mark">D</span> Dev Hire</a>
  <main class="auth-card">
    <a class="back-link" href="index.html">← Back to home</a>
    <p class="eyebrow">EMPLOYER ACCOUNT</p>
    <h1>Welcome back</h1>
    <p class="form-intro">Log in to manage your company and job postings.</p>
    <form action="#" method="post">
      <label for="companyEmail">Company email</label>
      <input id="companyEmail" name="companyEmail" type="email" placeholder="name@company.com" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required>

      <a href="forgot-password.html">Forgot password?</a>
      <button class="button button-primary button-full" type="submit">Log in</button>
    </form>
    <p class="switch-auth">Need a company account? <a href="signup-company.html">Sign up</a></p>
    <p class="fine-print"><a href="login-individual.html">Log in as an individual</a></p>
  </main>
</body>
</html>
