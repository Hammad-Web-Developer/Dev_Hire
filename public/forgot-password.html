
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Dev Hire</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body class="auth-page">

  <a class="brand auth-brand" href="index.html">
    <span class="brand-mark">D</span> Dev Hire
  </a>

  <main class="auth-card">
    <a class="back-link" href="index.html">← Back to home</a>

    <p class="eyebrow">ACCOUNT RECOVERY</p>
    <h1>Reset your password</h1>
    <p class="form-intro">
      Enter your email to receive a six-digit verification code.
    </p>

    <form action="#" method="post">

      <label for="email">Email address</label>
      <div class="input-action">
        <input type="email" id="email" name="email"
          placeholder="you@example.com" required>
        <button type="button"
          class="button button-small button-secondary">
          Send code
        </button>
      </div>

      <label for="passcode">Six-digit passcode</label>
      <input type="text" id="passcode" name="passcode"
        maxlength="6" pattern="[0-9]{6}"
        placeholder="Enter verification code" required>

      <label for="password">New password</label>
      <input type="password" id="password" name="password"
        placeholder="New password" required>

      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword"
        name="confirmPassword"
        placeholder="Confirm new password" required>

      <button type="submit"
        class="button button-primary button-full">
        Reset password
      </button>

    </form>

    <p class="switch-auth">
      Remembered your password?
      <a href="login-individual.html">Log in</a>
    </p>
  </main>

</body>
</html>
